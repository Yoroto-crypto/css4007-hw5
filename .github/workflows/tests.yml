name: tests

# Runs the automatic tests on every push. No API key is needed: the tests that involve a
# model use a clearly labelled FAKE model (ScriptedModel in tests/). The real Gemini
# demonstration (python -m helpdesk.main --all) is NOT run here.
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest -q